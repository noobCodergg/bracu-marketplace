name: Keep Render API warm

on:
  schedule:
    - cron: "2-57/5 * * * *"
  workflow_dispatch:

concurrency:
  group: keep-render-api-warm
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping public health endpoint
        env:
          HEALTH_URL: https://bracu-marketplace-api.onrender.com/api/v1/health
        run: |
          curl --fail --silent --show-error --max-time 20 --retry 2 --retry-delay 3 "$HEALTH_URL"
